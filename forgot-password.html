<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — NEXORA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages/auth.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
  <script src="config.js"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card fade-in">
      <div class="auth-brand">
        <a href="index.html" class="brand-logo-icon">
          <i data-lucide="key"></i>
        </a>
        <h1>Reset Password</h1>
        <p>Enter your email and we'll send a password recovery link.</p>
      </div>

      <div id="auth-alert" class="auth-alert"></div>

      <form id="reset-form" class="auth-form">
        <div class="input-group">
          <label for="reset-email">Email Address</label>
          <input type="email" id="reset-email" placeholder="name@example.com" required />
        </div>

        <button type="submit" class="btn btn-primary" id="btn-submit-reset" style="margin-top: var(--space-2); padding: 0.85rem;">
          Send Reset Link
        </button>
      </form>

      <div class="auth-footer">
        Remembered your password? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { authService } from './src/services/authService.js';
    import { ensureClient } from './src/config/supabase.js';

    if (window.lucide) window.lucide.createIcons();

    const form = document.getElementById('reset-form');
    const alertBox = document.getElementById('auth-alert');
    const submitBtn = document.getElementById('btn-submit-reset');

    const showAlert = (message, type = 'error') => {
      alertBox.textContent = message;
      alertBox.className = `auth-alert ${type}`;
    };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!ensureClient()) return;

      const email = document.getElementById('reset-email').value.trim();
      if (!email) return showAlert('Please enter your email.');

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending Link...';
        showAlert('');

        await authService.resetPassword(email);
        showAlert('Password reset link sent! Check your email inbox.', 'success');
      } catch (err) {
        showAlert(err.message || 'Failed to send reset link.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
